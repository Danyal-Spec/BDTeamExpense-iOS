# Project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate && open BDTeamExpense.xcodeproj
name: BDTeamExpense
options:
  bundleIdPrefix: com.bdteam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  BDTeamExpense:
    type: application
    platform: iOS
    sources:
      - path: BDTeamExpense
        excludes:
          - "www"
          - "www/**"
      - path: BDTeamExpense/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdteam.expense
        PRODUCT_NAME: BDTeamExpense
        INFOPLIST_FILE: BDTeamExpense/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
